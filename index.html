    <style>
      html, body { 
        background-color: #020617; 
        color: #f1f5f9; 
        margin: 0; 
        padding: 0; 
        height: 100%; 
        width: 100%;
        overflow: hidden; 
      }
      #root {
        position: relative;
        height: 100%;
        width: 100%;
        z-index: 10;
      }
      
      /* Premium Background Container */
      .premium-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      
      /* Animated Starfield */
      .sky-stars {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(2px 2px at 20% 30%, white, transparent),
          radial-gradient(2px 2px at 60% 70%, white, transparent),
          radial-gradient(1px 1px at 50% 50%, white, transparent),
          radial-gradient(1px 1px at 80% 10%, white, transparent),
          radial-gradient(2px 2px at 90% 60%, white, transparent),
          radial-gradient(1px 1px at 33% 80%, white, transparent),
          radial-gradient(1px 1px at 15% 60%, white, transparent);
        background-size: 200% 200%;
        animation: twinkle 120s linear infinite;
        opacity: 0.4;
      }
      
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }
      
      /* Warm Gradient Orb */
      .sky-orb-warm {
        position: absolute;
        top: -20%;
        right: -10%;
        width: 60%;
        height: 60%;
        background: radial-gradient(circle, rgba(251, 146, 60, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(80px);
        animation: float-orb-1 20s ease-in-out infinite;
      }
      
      /* Cool Gradient Orb */
      .sky-orb-cool {
        position: absolute;
        bottom: -15%;
        left: -10%;
        width: 55%;
        height: 55%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(70px);
        animation: float-orb-2 25s ease-in-out infinite;
      }
      
      /* Accent Orb (Fuchsia) */
      .sky-orb-accent {
        position: absolute;
        top: 40%;
        left: 40%;
        width: 45%;
        height: 45%;
        background: radial-gradient(circle, rgba(217, 70, 239, 0.1) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(90px);
        animation: float-orb-3 30s ease-in-out infinite;
      }
      
      /* Grid Overlay */
      .sky-grid {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 50px 50px;
        opacity: 0.3;
      }
      
      /* Orb Animations */
      @keyframes float-orb-1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(-5%, 5%) scale(1.05); }
        66% { transform: translate(5%, -5%) scale(0.95); }
      }
      
      @keyframes float-orb-2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(5%, -3%) scale(1.08); }
        66% { transform: translate(-5%, 3%) scale(0.92); }
      }
      
      @keyframes float-orb-3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-3%, 3%) scale(1.1); }
      }
      
      /* Leaflet overrides for dark mode feel */
      .leaflet-container {
        background: #020617;
        font-family: inherit;
      }
      .leaflet-control-attribution {
        background: rgba(0,0,0,0.5) !important;
        color: #aaa !important;
      }
      .leaflet-bar a {

        color: white !important;
        border-bottom: 1px solid #334155 !important;
      }
      .leaflet-bar a:hover {
        background-color: #334155 !important;
      }
    </style>
