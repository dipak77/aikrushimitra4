      .loader-bar-track {
        width: 160px;
        height: 3px;
        background: rgba(16, 185, 129, 0.15);
        border-radius: 99px;
        overflow: hidden;
        margin-top: 8px;
      }

      .loader-bar-fill {
        height: 100%;
        width: 40%;
